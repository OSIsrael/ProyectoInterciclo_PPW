<section class="contenedor">
  <h2>Solicitar Reserva de Laboratorio Completo (Docente)</h2>
  <p class="subtitulo">Las solicitudes docentes quedan en estado <strong>Pendiente</strong> hasta ser aprobadas por el administrador.</p>

  @if (mensajeExito) {
    <div class="alerta exito">{{ mensajeExito }}</div>
  }
  @if (mensajeError) {
    <div class="alerta error">{{ mensajeError }}</div>
  }

  <form (ngSubmit)="enviarSolicitud()" class="tarjeta formulario">
    <label>
      Docente solicitante:
      <select [(ngModel)]="form.usu_codigo" name="docente" required>
        @for (d of docentes; track d.usu_codigo) {
          <option [value]="d.usu_codigo">{{ d.usu_nombre }} {{ d.usu_apellido }} ({{ d.usu_username }})</option>
        }
      </select>
    </label>

    <label>
      Laboratorio:
      <select [(ngModel)]="form.lab_codigo" name="laboratorio" required>
        @for (lab of laboratorios; track lab.lab_codigo) {
          <option [value]="lab.lab_codigo">{{ lab.lab_nombre }} — Capacidad: {{ lab.lab_capacidad }} ({{ lab.lab_estado === 'D' ? 'Disponible' : 'Mantenimiento' }})</option>
        }
      </select>
    </label>

    <div class="fila">
      <label>
        Fecha:
        <input type="date" [(ngModel)]="form.fecha" name="fecha" required />
      </label>
      <label>
        Hora inicio:
        <input type="time" [(ngModel)]="form.horaInicio" name="horaInicio" required />
      </label>
      <label>
        Hora fin:
        <input type="time" [(ngModel)]="form.horaFin" name="horaFin" required />
      </label>
    </div>

    <label>
      Asignatura:
      <input type="text" [(ngModel)]="form.res_asignatura" name="asignatura" placeholder="Ej. Programación y Plataformas Web" required />
    </label>

    <label>
      Motivo o práctica a realizar:
      <textarea rows="3" [(ngModel)]="form.res_motivo" name="motivo" placeholder="Describe la práctica de laboratorio" required></textarea>
    </label>

    <button type="submit" class="btn-primario">Enviar Solicitud de Laboratorio</button>
  </form>
</section>
